<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Dental | Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3B82F6;
            --primary-dark: #1D4ED8;
            --bg: #F8FAFC;
            --text: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --radius: 20px;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.05), transparent),
                        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.05), var(--bg));
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 50px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), #10B981);
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 40px;
            text-decoration: none;
        }
        .logo i { color: var(--primary); }
        .logo span { color: var(--primary); }
        .tabs {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding-bottom: 15px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: 0.3s;
            font-size: 0.95rem;
            position: relative;
        }
        .tab.active {
            color: var(--primary);
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0; height: 2px;
            background: var(--primary);
        }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        input {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
            font-size: 1rem;
            background: #F1F5F9;
        }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }
        .btn-submit:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.4); }
        .msg { margin-top: 20px; text-align: center; font-size: 0.95rem; min-height: 24px; font-weight: 500; }
        .msg-error { color: #EF4444; }
        .msg-success { color: #10B981; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <a href="/" class="logo"><i class="fas fa-tooth"></i> Smile <span>Dental</span></a>
        
        <div class="tabs">
            <div class="tab active" id="tab-signin">Sign In</div>
            <div class="tab" id="tab-signup">Sign Up</div>
        </div>

        <form id="auth-form">
            <div id="name-group" class="form-group hidden">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
        </form>
        <div id="message" class="msg"></div>
    </div>

    <script>
        const authForm = document.getElementById('auth-form');
        const tabSignin = document.getElementById('tab-signin');
        const tabSignup = document.getElementById('tab-signup');
        const nameGroup = document.getElementById('name-group');
        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');
        let mode = 'signin';

        tabSignin.onclick = () => {
            mode = 'signin';
            tabSignin.classList.add('active');
            tabSignup.classList.remove('active');
            nameGroup.classList.add('hidden');
            submitBtn.innerText = 'Sign In';
            messageDiv.innerText = '';
        };
        tabSignup.onclick = () => {
            mode = 'signup';
            tabSignup.classList.add('active');
            tabSignin.classList.remove('active');
            nameGroup.classList.remove('hidden');
            submitBtn.innerText = 'Create Account';
            messageDiv.innerText = '';
        };

        authForm.onsubmit = async (e) => {
            e.preventDefault();
            const payload = { 
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            if (mode === 'signup') payload.name = document.getElementById('name').value;

            messageDiv.innerText = 'Processing...';
            messageDiv.className = 'msg';
            
            try {
                const res = await fetch(mode === 'signin' ? '/signin' : '/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    messageDiv.className = 'msg msg-success';
                    messageDiv.innerText = data.message;
                    if (mode === 'signin') setTimeout(() => window.location.href = data.role === 'admin' ? '/admin' : '/', 800);
                } else {
                    messageDiv.className = 'msg msg-error';
                    messageDiv.innerText = data.error;
                }
            } catch (err) {
                messageDiv.className = 'msg msg-error';
                messageDiv.innerText = 'System error. Please try again.';
            }
        };
    </script>
</body>
</html>
